# Start:  docker compose up --build
# Needs a file called .env.docker (copy it from .env.docker.example)

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: ghcr.io/aniketsinha05/viora-backend:${TAG:-latest}
  env_file: .env.docker

services:
  db:
    image: postgres:16-alpine
    env_file: .env.docker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Runs once: updates the database tables, then stops
  migrate:
    <<: *backend
    command: alembic -c backend/alembic.ini upgrade head
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend
    volumes:
      - appdata:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    image: ghcr.io/aniketsinha05/viora-web:${TAG:-latest}
    environment:
      DOMAIN: ${DOMAIN:-http://localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
  caddy_data:
